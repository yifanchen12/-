[project]
name = "bupt-library-crawler"
version = "0.1.0"
description = "Crawler and Excel exporter for Beijing University of Posts and Telecommunications Library OPAC holdings."
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "openpyxl>=3.1",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.scripts]
bupt-library-crawler = "bupt_library_crawler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

